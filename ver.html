<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tempo OS · Plan de contenido</title>
<style>
  html,body{margin:0;height:100%;background:#0c0e0c;color:#9aa39a;font-family:'DM Sans',system-ui,sans-serif}
  .msg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:10px;text-align:center;padding:24px}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:#FF6B30}
  .sub{font-family:'DM Sans',sans-serif;font-size:12px;color:#6b726b}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="msg"><div class="brand">TEMPO OS</div><div class="sub" id="msg">Cargando el plan…</div></div>
<script>
(async function () {
  var SUPA = { url: 'https://fzemsxyrzyssxprewwzs.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6ZW1zeHlyenlzc3hwcmV3d3pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2OTI3OTcsImV4cCI6MjA5NjI2ODc5N30.6rZw5gzIhUryZOzC2Mx4-kgrZSxWtjXSXS_-EL--FUg' };
  function fail(t) { var m = document.getElementById('msg'); if (m) m.textContent = t; }
  var token = new URLSearchParams(location.search).get('s');
  if (!token) { fail('Link inválido.'); return; }
  try {
    if (!window.supabase) {
      await new Promise(function (res, rej) { var sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
    }
    var sb = window.supabase.createClient(SUPA.url, SUPA.key);
    var r = await sb.rpc('get_share', { p_token: token });
    var row = r.data && r.data[0];
    if (r.error || !row || !row.html) { fail('Este link no existe, expiró o fue revocado.'); return; }
    document.open(); document.write(row.html); document.close();
  } catch (e) { fail('No se pudo cargar el plan. Revisa tu conexión.'); }
})();
</script>
</body>
</html>
